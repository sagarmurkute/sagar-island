name: 💡 Feature Request
description: Suggest a new idea, integration, or improvement for Sagar Island
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Have an idea to make Sagar Island even better? Let us know!

  - type: textarea
    id: problem
    attributes:
      label: Is your feature request related to a problem?
      description: A clear description of what the problem or limitation is.
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution / Feature
      description: Describe the feature, behavior, or UI design you would like to see.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternative Solutions Considered
      description: Any other approaches or existing utilities you've looked at.
